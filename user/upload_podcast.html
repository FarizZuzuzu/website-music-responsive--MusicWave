<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicWave Podcast Upload</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/img/musicwave-icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
 <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="{{ url_for('static', filename='assets/img/musicwave-logo.svg') }}" alt="MusicWave" class="brand-logo">
    </div>

    <ul class="menu">
      <li><a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
      <li><a href="{{ url_for('library') }}"><i class="fa-solid fa-bookmark"></i><span>Library</span></a></li>
      <li><a href="{{ url_for('explore') }}"><i class="fa-solid fa-tags"></i><span>Explore</span></a></li>
      <li><a href="{{ url_for('settings') }}"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
    </ul>

  </aside>
  
  <div class="overlay" id="overlay"></div>

  {% extends "base.html" %}
  {% block content %}

  

    
      <div class="upload-container">
        <h2><i class="fa-solid fa-podcast"></i> Upload Podcast Kamu</h2>

        <form action="{{ url_for('upload_podcast') }}" method="POST" enctype="multipart/form-data">
          <label>Judul Podcast</label>
          <input type="text" name="title" required>

          <label>Nama Host</label>
          <input type="text" name="host" required>

          <label>Kategori</label>
          <input type="text" name="category" placeholder="Edukasi, Komedi, Musik, dll">

          <label>Deskripsi</label>
          <textarea name="description" rows="3" placeholder="Tuliskan deskripsi singkat podcast kamu"></textarea>

          <label>File Audio (MP3)</label>
          <input type="file" name="audio_file" accept=".mp3" required>

          <label>Cover Podcast (opsional)</label>
          <input type="file" name="cover_file" accept="image/*">

          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-upload"></i> Upload Podcast
          </button>
        </form>

        <a href="{{ url_for('profile') }}" class="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Profil
        </a>
      </div>
    

  {% endblock %}
